apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workbridge-web
  namespace: workbridge
spec:
  ingressClassName: nginx
  rules:
    - host: workbridge.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
