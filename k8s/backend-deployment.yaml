apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: workbridge
spec:
  replicas: 1                      
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: workbridge-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: ALLOWED_ORIGINS
              value: "http://workbridge.local"   
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_TO_FILE
              value: "false"
          envFrom:
            - secretRef:
                name: db-credentials          