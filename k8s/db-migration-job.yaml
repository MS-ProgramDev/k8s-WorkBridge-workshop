apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: workbridge
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: workbridge-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/create_db_table.py"]
          envFrom:
            - secretRef:
                name: db-credentials
